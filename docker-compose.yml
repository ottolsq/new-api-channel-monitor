services:
  channel-monitor:
    build: .
    image: new-api-channel-monitor:latest
    container_name: new-api-channel-monitor
    restart: always
    # 工作目录 /app 下放 .env（KEY=VALUE），程序启动时自动读取
    volumes:
      # .env 与 SQLite 数据库持久化
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/app/data/monitor.db
